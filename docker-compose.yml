version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okr-backend
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=file:/app/database/prod.db
      - JWT_SECRET=super-secret-key-change-me-in-production
    volumes:
      - sqlite_data:/app/database
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okr-frontend
    restart: always
    environment:
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlite_data:
